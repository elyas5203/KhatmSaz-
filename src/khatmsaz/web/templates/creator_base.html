<!doctype html>
<html lang="{{ lang }}" dir="{{ 'ltr' if lang == 'en' else 'rtl' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4c45">
  <title>{% block title %}{{ t('web.creator.panel_title', lang) }} | ختم‌ساز{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/creator" aria-label="{{ t('web.creator.home_aria', lang) }}"><span class="mihrab">خ</span><span><b>ختم‌ساز</b><small>{{ t('web.creator.panel_title', lang) }}</small></span></a>
    <form action="/creator/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="ghost" type="submit">{{ t('web.creator.secure_logout', lang) }}</button></form>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <nav class="dock"><a href="/creator">{{ t('web.creator.nav_my_khatms', lang) }}</a></nav>
</body>
</html>
