<!doctype html>
<html lang="{{ lang }}" dir="{{ 'ltr' if lang == 'en' else 'rtl' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>{% block title %}{{ t('web.creator.panel_title', lang) }} | ختم‌ساز{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Vazirmatn', 'sans-serif'] },
          colors: { jade: '#0f4c45', mint: '#55a898', saffron: '#d99b2b' }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #020617;
      background-image: radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.08), transparent 35%),
                        radial-gradient(circle at 85% 30%, rgba(20, 184, 166, 0.08), transparent 35%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .glass-card:hover {
      border-color: rgba(16, 185, 129, 0.3);
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.1);
      transform: translateY(-2px);
    }
    /* Orbs for background */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.4;
      pointer-events: none;
    }
    .bg-orb-1 { width: 300px; height: 300px; background: rgba(16, 185, 129, 0.15); top: -100px; left: -100px; }
    .bg-orb-2 { width: 400px; height: 400px; background: rgba(20, 184, 166, 0.1); bottom: -150px; right: -100px; }
    
    .status {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15rem 0.6rem;
      border-radius: 9999px;
      border: 1px solid transparent;
      direction: ltr;
    }
    .status.active { background: rgba(16, 185, 129, 0.1); color: #34d399; border-color: rgba(16, 185, 129, 0.2); }
    .status.completed { background: rgba(56, 189, 248, 0.1); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.2); }
    .status.cancelled, .status.banned { background: rgba(244, 63, 94, 0.1); color: #fb7185; border-color: rgba(244, 63, 94, 0.2); }
    .status.suspended, .status.warned, .status.draft { background: rgba(251, 191, 36, 0.1); color: #fbbf24; border-color: rgba(251, 191, 36, 0.2); }
  </style>
</head>
<body class="font-sans antialiased text-slate-200 relative overflow-x-hidden">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <!-- Topbar -->
  <header class="sticky top-0 z-50 glass-panel border-b border-white/10 px-4 py-3 flex justify-between items-center">
    <a href="/creator" class="flex items-center gap-3 group" aria-label="{{ t('web.creator.home_aria', lang) }}">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-800 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-emerald-900/50 group-hover:shadow-emerald-500/30 transition-all">خ</div>
      <div class="flex flex-col">
        <span class="font-bold text-lg leading-tight text-white group-hover:text-emerald-400 transition-colors">ختم‌ساز</span>
        <span class="text-[0.65rem] text-emerald-500/80">{{ t('web.creator.panel_title', lang) }}</span>
      </div>
    </a>
    
    <form action="/creator/logout" method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="text-sm font-medium text-slate-400 hover:text-rose-400 px-3 py-1.5 rounded-lg border border-transparent hover:border-rose-500/30 hover:bg-rose-500/10 transition-colors flex items-center gap-2" type="submit">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
        <span class="hidden sm:inline">{{ t('web.creator.secure_logout', lang) }}</span>
      </button>
    </form>
  </header>

  <!-- Main Content -->
  <main class="flex-1 w-full max-w-5xl mx-auto p-4 sm:p-6 lg:p-8 pb-24 relative z-10">
    {% block content %}{% endblock %}
  </main>

  <!-- Mobile Bottom Dock (visible on mobile only) -->
  <nav class="sm:hidden fixed bottom-0 left-0 right-0 glass-panel border-t border-white/10 px-6 py-4 flex justify-around z-50 shadow-[0_-8px_24px_rgba(0,0,0,0.5)]">
    <a href="/creator" class="flex flex-col items-center gap-1 text-emerald-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
      <span class="text-[0.65rem] font-bold">{{ t('web.creator.nav_my_khatms', lang) }}</span>
    </a>
  </nav>
</body>
</html>
