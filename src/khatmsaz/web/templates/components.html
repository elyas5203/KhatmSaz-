{% macro tooltip(text) %}
<div class="relative group inline-block align-middle mr-1">
  <svg class="w-4 h-4 text-slate-500 hover:text-emerald-400 cursor-help transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
  <div class="absolute bottom-full right-1/2 translate-x-1/2 mb-2 w-64 p-3 bg-slate-900/95 backdrop-blur-sm text-slate-300 text-xs leading-relaxed rounded-xl shadow-2xl border border-slate-700 opacity-0 group-hover:opacity-100 invisible group-hover:visible transition-all z-50 pointer-events-none text-right font-normal">
    {{ text }}
  </div>
</div>
{% endmacro %}
