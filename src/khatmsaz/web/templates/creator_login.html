<!doctype html>
<html lang="{{ lang }}" dir="{{ 'ltr' if lang == 'en' else 'rtl' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>{{ t('web.creator.panel_title', lang) }} | ختم‌ساز</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'sans-serif'] } } }
    }
  </script>
  <style>
    body {
      background-color: #020617;
      background-image: radial-gradient(circle at 50% -20%, rgba(16, 185, 129, 0.15), transparent 40%),
                        radial-gradient(circle at -20% 80%, rgba(20, 184, 166, 0.1), transparent 40%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #e2e8f0;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="font-sans antialiased text-slate-200 relative p-6">
  <section class="glass-card w-full max-w-md rounded-3xl p-8 sm:p-10 text-center relative overflow-hidden">
    <!-- decorative light sweep -->
    <div class="absolute top-0 inset-x-0 h-px bg-gradient-to-r from-transparent via-emerald-400/50 to-transparent"></div>
    
    <div class="mx-auto w-20 h-20 rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-800 flex items-center justify-center text-white font-bold text-4xl shadow-xl shadow-emerald-900/40 mb-6">خ</div>
    
    <h1 class="text-2xl font-bold text-white mb-2">{{ t('web.creator.panel_title', lang) }}</h1>
    
    {% if invalid %}
    <div class="mt-6 mb-4 p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm font-medium">
      {{ t('web.creator.login_only_mini_app', lang) }}
    </div>
    {% endif %}
    
    <p class="text-slate-400 text-sm mt-4 leading-relaxed">{{ t('web.creator.login_mini_app_only_notice', lang) }}</p>
  </section>
</body>
</html>
