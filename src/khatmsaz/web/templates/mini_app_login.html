<!doctype html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ title }}</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Tahoma,Arial,sans-serif;background:var(--tg-theme-bg-color,#f4f7f5);color:var(--tg-theme-text-color,#17352a)}main{width:min(88vw,420px);padding:28px;text-align:center;border-radius:22px;background:var(--tg-theme-secondary-bg-color,#fff);box-shadow:0 12px 40px #17352a18}h1{font-size:1.35rem}.status{line-height:2}.error{color:#b42318}</style>
</head><body><main><div style="font-size:2.5rem">{% if error %}⚠️{% else %}⏳{% endif %}</div>
<h1>{{ title }}</h1><p id="status" class="status {% if error %}error{% endif %}">{{ error or "در حال بررسی ورود امن شما…" }}</p>
<form id="auth" action="{{ auth_path }}" method="post"><input id="init-data" type="hidden" name="init_data"></form>
</main>{% if not error %}<script>(()=>{const app=window.Telegram&&window.Telegram.WebApp,status=document.getElementById('status');if(!app||!app.initData){status.textContent='این صفحه فقط از دکمهٔ داخل بات تلگرام باز می‌شود.';status.className='status error';return}app.ready();app.expand();document.getElementById('init-data').value=app.initData;document.getElementById('auth').submit()})();</script>{% endif %}</body></html>
