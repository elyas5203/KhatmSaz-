{% extends "base.html" %}{% block title %}قالب پیام | ختم‌ساز{% endblock %}
{% block content %}
<section class="page-title"><p class="eyebrow">متن‌های سامانه</p><h1>نسخه‌های پیام</h1></section>
<section class="cards">{% for item in items %}<article class="template-card"><header><b>{{ item.key }}</b><span>{{ item.locale }} · v{{ item.version }}</span></header><p>{{ item.body }}</p><form method="post" action="/templates/{{ item.id }}/toggle"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="{% if item.enabled %}danger{% endif %}" type="submit">{% if item.enabled %}غیرفعال کردن{% else %}فعال کردن{% endif %}</button></form></article>{% else %}<p class="empty">قالبی ثبت نشده است.</p>{% endfor %}</section>
{% endblock %}
